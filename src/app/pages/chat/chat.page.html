<ion-content class="chat-page">
  <div class="day-divider"><span>Hoje</span></div>

  <div class="messages">
    <div *ngFor="let m of messages" class="bubble-row" [class.mine]="m.fromMe">
      
      <!-- AVATAR DA PESSOA (Só aparece nas mensagens recebidas) -->
      <div class="message-avatar" *ngIf="!m.fromMe">
        {{ contactName ? contactName.charAt(0) : '?' }}
      </div>

      <!-- CONTEÚDO (Nome + Balão) -->
      <div class="message-content" [class.mine]="m.fromMe">
        <!-- NOME DA PESSOA -->
        <span class="message-name" *ngIf="!m.fromMe">{{ contactName }}</span>
        
        <div class="bubble" [class.mine]="m.fromMe">
          <span class="bubble-text">{{ m.text }}</span>
          <span class="bubble-time">
            {{ m.time }}
            <ion-icon *ngIf="m.fromMe" name="checkmark-done" [class.seen]="m.seen"></ion-icon>
          </span>
        </div>
      </div>

    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  
  <!-- BANDEJA DE EMOJIS (Aparece ao clicar no sorriso) -->
  <div class="emoji-tray" *ngIf="mostrarEmojis">
    <span class="emoji-item" *ngFor="let emoji of listaEmojis" (click)="addEmoji(emoji)">
      {{ emoji }}
    </span>
  </div>

  <ion-toolbar class="composer-toolbar">
    <div class="composer">
      <ion-button fill="clear" class="composer-icon">
        <ion-icon name="add-circle-outline"></ion-icon>
      </ion-button>

      <ion-input
        [(ngModel)]="draft"
        placeholder="Digite uma mensagem..."
        class="composer-input"
        (keyup.enter)="send()">
      </ion-input>

      <!-- BOTÃO DE EMOJI COM AÇÃO DE CLIQUE -->
      <ion-button fill="clear" class="composer-icon" (click)="toggleEmojis()">
        <ion-icon name="happy-outline"></ion-icon>
      </ion-button>

      <ion-button
        class="send-btn"
        [class.active]="draft.trim().length > 0"
        (click)="send()">
        <ion-icon [name]="draft.trim().length > 0 ? 'send' : 'mic'"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
