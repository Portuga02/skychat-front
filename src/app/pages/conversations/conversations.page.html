<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Conversas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="conversas.length === 0" class="ion-text-center ion-padding" style="margin-top: 40px;">
    <h2>Nenhuma conversa ainda</h2>
    <p>Clique no botão abaixo para escolher um contato e iniciar um bate-papo.</p>
  </div>
<ion-list *ngIf="conversas.length > 0">
    <ion-item *ngFor="let c of conversas" [routerLink]="['/chat', c.id]">
      <ion-label>
        <!-- AQUI ESTÁ O SEGREDO: c.nomeExibicao -->
        <h2>{{ c.nomeExibicao || 'Sem nome' }}</h2>
        <p>{{ c.ultimaMensagem || 'Nenhuma mensagem' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Botão Flutuante (FAB) para abrir a tela de Contatos -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/contatos">
      <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
